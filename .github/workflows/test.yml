name: test
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PowerShell and Node offline suites
        shell: pwsh
        run: pwsh -NoProfile -File tests/Run.Tests.ps1
      - name: Release privacy scan
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Test-Release.ps1
